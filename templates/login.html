<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Silversea Market Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0a2540',
            'green-accent': '#2d6a4f',
            'green-accent-light': '#40916c',
            'bg-page': '#f0f4f1',
          },
          fontFamily: {
            display: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Space Grotesk', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="bg-bg-page font-display text-gray-800 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-xl font-bold tracking-tight text-navy font-heading">Silversea Media</div>
      <div class="text-sm text-gray-500">Market Intelligence</div>
    </div>

    <div class="bg-white shadow-soft rounded-xl p-8 border border-gray-100">
      <h1 class="text-lg font-semibold text-navy mb-1 font-heading">Sign in</h1>
      <p class="text-sm text-gray-500 mb-6">Enter the shared access password to continue.</p>

      {% if error %}
      <div class="mb-4 rounded-md bg-rose-50 border border-rose-200 text-rose-700 text-sm px-3 py-2">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autofocus
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-accent focus:border-green-accent"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-green-accent hover:bg-green-accent-light text-white text-sm font-medium rounded-md px-4 py-2.5 transition-colors"
        >
          Sign In
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">Internal tool — Silversea Media BD/Sales team</p>
  </div>
</body>
</html>
